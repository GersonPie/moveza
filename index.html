<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estamos em Manutenção</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            text-align: center;
            max-width: 600px;
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }
        .icon {
            font-size: 50px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #2c3e50;
        }
        p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #7f8c8d;
            margin-bottom: 30px;
        }
        .badge {
            display: inline-block;
            background-color: #e67e22;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }
        .contact {
            font-size: 0.9rem;
            border-top: 1px solid #ecf0f1;
            padding-top: 20px;
        }
        .contact a {
            color: #3498db;
            text-decoration: none;
        }
        .contact a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon">⚙️</div>
        <div class="badge">Manutenção Programada</div>
        <h1>Voltamos já!</h1>
        <p>Estamos a realizar algumas melhorias no nosso website para lhe proporcionar uma experiência ainda melhor. O processo será rápido e estaremos de volta online muito em breve.</p>
        
        <div class="contact">
            Precisa de ajuda urgente? Contacte-nos através do <a href="mailto:infgersontamele@outlook.com">info@moveza.co.mz</a>
        </div>
    </div>

</body>
</html>
